# Public entry point. Every request from Postman goes through the API gateway.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-registration
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30080
---
# Internal only. The gateway uses this to reach the update service in Pod 2.
apiVersion: v1
kind: Service
metadata:
  name: update-service
spec:
  type: ClusterIP
  selector:
    app: update-service
  ports:
    - name: http
      port: 4002
      targetPort: 4002
