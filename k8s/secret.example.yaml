# Copy this to secret.yaml, paste your real MongoDB Atlas URI, then:
#   kubectl apply -f k8s/secret.yaml
# secret.yaml is in .gitignore so your password never ends up on GitHub.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/studentdb?retryWrites=true&w=majority"
