# Local test run (optional). Uses a local Mongo container instead of Atlas.
# PowerShell:  docker compose up --build
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  registration-service:
    build: ./registration-service
    environment:
      - PORT=4001
      - MONGO_URI=mongodb://mongo:27017/studentdb
    depends_on:
      - mongo

  update-service:
    build: ./update-service
    environment:
      - PORT=4002
      - MONGO_URI=mongodb://mongo:27017/studentdb
    depends_on:
      - mongo

  api-gateway:
    build: ./api-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - REGISTRATION_SERVICE_URL=http://registration-service:4001
      - UPDATE_SERVICE_URL=http://update-service:4002
    depends_on:
      - registration-service
      - update-service
